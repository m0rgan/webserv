server {
    listen       9090;
	# listen       9090;
    server_name  DOMAINBONUS;

    location / {
        root /app/bonus/website/content;
        index  index2.html;
		limit_except GET POST;
		client_max_body_size 1;
		# return 302 /error;
		# return 301 /error;
		# return 304 /error;
    }

	location /error {
        root /var/www/bonus-website;
        index error.html; # Serve an error page for /error
    }

    error_page  404 /404.html;
    location /404.html {
        root /var/www/bonus-website;
    }
}

