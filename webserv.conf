server {
	listen 8080;
	listen 127.0.0.1:8080;
	listen [::]:8080;
	# listen 9090;
	# listen 444;
	server_name localhost;
	autoindex on;
	# error_page   404.html;
	# client_max_body_size 1;
 
	location / {
	 	# root /var/www/html;
		# root /var/www/bonus-website;
		root /app/content;
		# client_max_body_size 5;
		# root /bonus/website/content
		index index2.html index.php index.py; #index.html
		# return 301 /error;
	}
	
	location /redirme {
		root /hello_world;
		limit_except POST DELETE;
		return 301 /error;
	}

	location /private/ {
		autoindex off;
	}

	location /readonly/ {
    	limit_except GET;
	}

	location /error {
		client_max_body_size 3;
		return 500;
	}

	location /php {
		client_max_body_size 1;
		root /var/www/bonus-website;
		autoindex on;
	}

	location /upload {
		root /app/content/upload;
		limit_except GET;
	}

	location /images {
		alias /app/content/images;
		error_page   404.html;
	}

	location /sessions {
		alias /app/content/sessions/;
		# client_max_body_size 1;
		error_page   404.html;
	}
}

